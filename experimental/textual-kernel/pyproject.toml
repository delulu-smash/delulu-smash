# AUTO-GENERATED by Claude Code
[project]
name = "textual-kernel"
version = "0.1.0"
description = "PoC: a Jupyter-like, in-process notebook kernel with a Textual TUI"
requires-python = ">=3.13"
dependencies = [
    "delulu-smash",
    "jedi>=0.20.0",
    # Cell image output (display.image_view) and rendering it via Kitty's
    # Terminal Graphics Protocol (kitty_image.py) -- no other
    # terminal-graphics library involved, see kitty_image.py's docstring
    # for why.
    "pillow>=11.0.0",
    "polars>=1.44.1",
    "textual[syntax]>=0.86",
]

[project.scripts]
textual-kernel = "textual_kernel.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/textual_kernel"]

[tool.uv]
package = true

[tool.uv.sources]
# AI mode (`Kernel.run_ai`) reuses `ds.ai.agent` from the monorepo's main `ds`
# package rather than duplicating agent setup here -- pulled in as an
# editable path dependency on the repo root, whose distribution name is
# "delulu-smash" even though the importable module is "ds" (see root
# pyproject.toml's [tool.setuptools.packages.find]).
delulu-smash = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "textual-dev>=1.8.0",
]
