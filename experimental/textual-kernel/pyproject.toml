[project]
name = "textual-kernel"
version = "0.1.0"
description = "PoC: a Jupyter-like, in-process notebook kernel with a Textual TUI"
requires-python = ">=3.11"
dependencies = [
    "jedi>=0.20.0",
    "polars>=1.44.1",
    "textual[syntax]>=0.86",
]

[project.scripts]
textual-kernel = "textual_kernel.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/textual_kernel"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "textual-dev>=1.8.0",
]
