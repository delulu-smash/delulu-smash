# AUTO-GENERATED by Claude Code
# Eval cases for the Smash knowledge agent (ds.ai.agent): questions with known answers from docs/.
# Run: uv run ds ai eval   |   Add cases whenever a docs/ page is added or a fact is corrected.
# Each case's `Contains` checks the answer cites the docs page (docs-first behavior); the dataset-level
# LLMJudge checks the facts against expected_output.
cases:
  - name: stale_shield
    inputs: Does hitting a shield stale a move in Smash Ultimate?
    expected_output: >-
      Yes. In Ultimate, moves that hit a shield (including perfect shields) enter the stale queue, but that
      queue slot's reductor is multiplied by 0.85, so shield hits stale slightly less than real hits.
    metadata: {topic: stale_moves, source: docs/mechanics/stale_moves.md}
    evaluators:
      - Contains: {value: stale_moves.md}
  - name: stale_queue_size
    inputs: How many moves are tracked in the stale moves queue, and which moves get added?
    expected_output: >-
      9 moves. Only moves that connect (hit an opponent, a shield, or something damageable) are added; whiffed
      moves don't stale.
    metadata: {topic: stale_moves, source: docs/mechanics/stale_moves.md}
    evaluators:
      - Contains: {value: stale_moves.md}
  - name: stale_full_multiplier
    inputs: How much damage does a fully staled move deal compared to its base damage?
    expected_output: About 0.4695x (46.95%) of base damage, since all 9 reductors sum to 0.5305.
    metadata: {topic: stale_moves, source: docs/mechanics/stale_moves.md}
    evaluators:
      - Contains: {value: stale_moves.md}
  - name: stale_fresh_bonus
    inputs: Is there any bonus for using a move that hasn't been used recently?
    expected_output: Yes, a move not in the stale queue is fresh and deals 1.05x damage (the freshness bonus).
    metadata: {topic: stale_moves, source: docs/mechanics/stale_moves.md}
    evaluators:
      - Contains: {value: stale_moves.md}
  - name: stale_knockback
    inputs: If my kill move is stale, does it lose as much knockback as it loses damage?
    expected_output: >-
      No. Only about 30% of the staleness modifier is applied in the knockback formula (behavior inherited from
      Smash 4), so stale KO moves lose much less knockback than damage. Note this rule is marked unverified for
      Ultimate specifically.
    metadata: {topic: stale_moves, source: docs/mechanics/stale_moves.md}
    evaluators:
      - Contains: {value: stale_moves.md}
  - name: stale_taunts
    inputs: Can I refresh my moves by hitting with a taunt?
    expected_output: >-
      No. Taunts never enter the stale queue, so they can't refresh other moves, with the exception of Kazuya's
      side taunt (Demon's Wrath), which does stale.
    metadata: {topic: stale_moves, source: docs/mechanics/stale_moves.md}
    evaluators:
      - Contains: {value: stale_moves.md}
  - name: stale_training_mode
    inputs: How do I lab KO percents in training mode without stale moves messing up the results?
    expected_output: >-
      Turn the Stale Moves toggle off in Training Mode. Moves still enter the queue but deal base damage.
    metadata: {topic: stale_moves, source: docs/mechanics/stale_moves.md}
    evaluators:
      - Contains: {value: stale_moves.md}
  # game-confusion trap: Brawl reset the queue on transformation, Ultimate does not
  - name: stale_pokemon_trainer_switch
    inputs: Does switching Pokemon as Pokemon Trainer reset stale moves?
    expected_output: >-
      No. Squirtle, Ivysaur and Charizard share one stale queue in Ultimate and switching doesn't reset it
      (only Brawl reset it on switching).
    metadata: {topic: stale_moves, source: docs/mechanics/stale_moves.md, trap: other-game}
    evaluators:
      - Contains: {value: stale_moves.md}
  - name: stale_pummel_refresh
    inputs: What's the easiest way to refresh my stale moves in Smash Ultimate?
    expected_output: >-
      Pummel before throwing: each pummel (and the throw) takes its own stale queue slot, pushing stale moves
      back. Every other move that connects (jabs, varied throws) also refreshes. A KO resets the queue.
    metadata: {topic: stale_moves, source: docs/mechanics/stale_moves.md}
    evaluators:
      - Contains: {value: stale_moves.md}
  - name: stale_throws_separate
    inputs: If I keep using the same throw, does using a different throw help with staling?
    expected_output: >-
      Yes. Each throw direction is a separate move with its own queue entries, so alternating throws avoids
      staling one throw, and each throw also pushes other moves back a slot.
    metadata: {topic: stale_moves, source: docs/mechanics/stale_moves.md}
    evaluators:
      - Contains: {value: stale_moves.md}
  - name: stale_refresh_amount
    inputs: My move is fully staled. How much damage does it get back after 3 other moves enter the queue?
    expected_output: >-
      It goes from about 0.47x to about 0.72x of base damage (derived from the reductor table); it needs 9
      other entries to be fresh again (1.05x).
    metadata: {topic: stale_moves, source: docs/mechanics/stale_moves.md}
    evaluators:
      - Contains: {value: stale_moves.md}
  # unsourced claim: answer should flag uncertainty rather than state a confident number
  - name: stale_rapid_jab_unverified
    inputs: Does each hit of a rapid jab count as a separate entry in the stale queue?
    expected_output: >-
      It isn't confirmed: the rapid jab enters the queue, but whether the looping hits count once or per hit is
      unverified; the docs suggest labbing it (Training Mode, stale moves on).
    metadata: {topic: stale_moves, source: docs/mechanics/stale_moves.md, trap: unverified}
    evaluators:
      - Contains: {value: stale_moves.md}
  - name: damage_1v1_default
    inputs: How much damage does Little Mac's jab 1 do?
    expected_output: >-
      1.8% in a 1v1 (1.5% base damage x the 1.2 1v1 multiplier). The answer assumes 1v1 by default and shows the
      listed base value alongside.
    metadata: {topic: damage_multiplier, source: SmashDb framedata}
  - name: damage_doubles_no_multiplier
    inputs: In doubles, how much damage does Little Mac's jab 1 do?
    expected_output: 1.5% (base damage; the 1.2x multiplier only applies in 1v1).
    metadata: {topic: damage_multiplier, source: SmashDb framedata}
  - name: sl_armor_dk_overview
    inputs: What moves of Donkey Kong can Little Mac's neutral B armor through?
    expected_output: >-
      A per-hitbox list. Uncharged Straight Lunge tanks jab 1/2, down tilt, up B and aerial down B hits fresh;
      forward tilt (8/9), up tilt (10), dash attack (12/9), side B (10) and the aerials only after enough stales
      (eg dash attack early after 5, up tilt after 3); forward smash and up smash never (uncharged). Fully charged
      SL tanks most tilts/aerials fresh. Notes the 1v1 multiplier doesn't change the result.
    metadata: {topic: sl_armor, source: pkgs/ds/ai/little_mac.py}
  - name: sl_armor_stale_count
    inputs: How many times does DK need to use early dash attack before uncharged Straight Lunge armors it?
    expected_output: 5 times in a row (12% x 0.62085 = 7.45% <= 8%); fresh it deals 12.6% and breaks the armor.
    metadata: {topic: sl_armor, source: pkgs/ds/ai/little_mac.py}
  - name: sl_armor_1v1_trap
    inputs: In a 1v1, does the 1.2x damage multiplier make DK's jab 2 break Little Mac's uncharged neutral B armor?
    expected_output: >-
      No. Jab 2 (6%) is tanked; the 1v1 multiplier scales the armor threshold too (8% -> 9.6%), so it doesn't
      change what Straight Lunge armors.
    metadata: {topic: sl_armor, source: docs/moveset.md, trap: 1v1-multiplier}
  - name: stale_damage_calc
    inputs: How much damage does a 12% move do after being used 3 times in a row, in a 1v1?
    expected_output: About 10.77% (12 x 0.7482 staleness = 8.98%, x 1.2 in 1v1).
    metadata: {topic: stale_moves, source: pkgs/ds/ai/mechanics.py}
evaluators:
  - LLMJudge:
      rubric: >-
        The answer is about Super Smash Bros. Ultimate and agrees with the expected output on every key fact
        (numbers, yes/no, exceptions). Extra correct detail is fine; any contradiction or other-game (Smash 4,
        Brawl, Melee) behavior presented as Ultimate fails.
      include_input: true
      include_expected_output: true
