# AUTO-GENERATED by Claude Code
# Purpose: the monthly reminder for manual DATA maintenance: the data updates (pkgs/ds/data tables) that
#          need a hand step, eg a download. On the morning of the 1st it opens a GitHub issue (GitHub
#          notifies the repo owner) pointing at `ds data manual_maintenance`. Data only: other maintenance
#          (packages, tech stack, tech debt) would get its own reminder. The issue only names the command
#          (this repo is public); what it runs is in pkgs/ds/cli/data.py (_MANUAL_STEPS).
#          "Run workflow" on the Actions tab sends one by hand.
# Note: GitHub turns off scheduled workflows in a public repo after 60 days with no commits; re-enable it
#       on the Actions tab if that happens.

name: Manual data maintenance reminder
on:
  workflow_dispatch: # by hand from the Actions tab
  schedule:
    - cron: '0 13 1 * *' # the 1st of each month, 13:00 UTC = 8:00 EST / 9:00 EDT

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Open this month's data maintenance issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Manual data maintenance: $(date -u +%Y-%m)"
          # one issue per month: skip when this month's is already open
          if [ "$(gh issue list --state open --search "in:title \"${title}\"" --json number --jq 'length')" != "0" ]; then
            echo "Already open: ${title}"
            exit 0
          fi
          gh issue create --title "${title}" --body "$(cat <<'BODY'
          Monthly manual **data** maintenance: the data tables (`pkgs/ds/data/`) that need a hand step to
          update, eg a file to download first. On a machine with the repo:

          ```sh
          ds data manual_maintenance
          ```

          Then commit the updated data tables and close this issue.
          BODY
          )"
