# AUTO-GENERATED by GitHub Copilot
# This file was created automatically with `myst init --gh-pages` 🪄 💚
# and modifcations for "docs" subfolder talked about in https://github.com/jupyter-book/mystmd/issues/1849

name: MyST GitHub Pages Deploy
on:
  push:
    # Runs on pushes targeting the default branch
    branches: [main]
  # Runs once every 3 days at 00:00 UTC.
  # We do this so that website up to date (eg updates to file assets from R2 storage, ie assets.delulu-smash.com)
  schedule:
    - cron: '0 0 */3 * *'
env:
  # `BASE_URL` determines the website is served from, including CSS & JS assets
  # You may need to change this to `BASE_URL: ''`
  BASE_URL: ''

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  # Runs .pre-commit-config.yaml hooks (ruff, json/yaml checks, nbstripout) in CI, mirroring what
  # pre-commit/action does (that action is maintenance-only; its README points to pre-commit.ci).
  # Separate job so lint failures are reported without blocking the docs deploy.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # hook repos in .pre-commit-config.yaml use SSH URLs; CI has no SSH key, so clone over HTTPS instead
      - name: Rewrite GitHub SSH URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      # cache hook environments like pre-commit/action does, keyed on the config
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure --color=always
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Install MyST Markdown
        run: npm install -g mystmd
      - name: Build HTML Assets
        run: myst build --html
        working-directory: ./docs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: './docs/_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      # from gemini
      - name: Post build status to Discord
        uses: sarisia/actions-status-discord@v1
        if: always() # Ensures the step runs even if the job fails
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Build Status"
          description: "The build process has completed."
