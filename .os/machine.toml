# AUTO-GENERATED by Claude Code
# The one list of what every machine should have. `os sync` applies it to the machine and writes
# this machine's changes back into it (it asks first). Editing it by hand is fine too: the next
# `os sync` applies the edit. Details: .os/README.md.

[packages]
# Packages on top of a stock Omarchy install (`omarchy pkg add` / `omarchy pkg aur add`).
pacman = [
    # tooling
    "github-cli",
    "git-lfs",
    "rust",
    # editors / terminals
    "zed",
    "visual-studio-code-bin",
    "sublime-text-4",
    "helix",
    "kitty",
    "ghostty",
    "typora",
    # apps
    "1password",
    "1password-cli",
    "zen-browser-bin",
    "signal-desktop",
    "spotify",
    "steam",
    # AI CLIs
    "aichat",
    "gemini-cli",
    # media (wf-recorder is needed by .os/scripts/keybindings/screenrecord.sh; ffmpeg by that script,
    # the docs build (.mov conversion) and pkgs/ds/util/gif.py)
    "wf-recorder",
    "ffmpeg",
    "avidemux-qt",
    "video-trimmer",
    "gradia",
    # cli utils
    "glow",
    "yazi",
    "yq",
    "xclip",
    "zenity",
    "libqalculate",
    "flatpak",
    # fonts
    "noto-fonts-extra",
    "ttf-cascadia-mono-nerd",
    "libfprint-git",
    "mkinitcpio",
    "openssh",
    # password tools for `os pwd-store` / `os pwd-copy` and .os/scripts/keybindings/pwd-copy.sh
    # (secret-tool, the keyring, wl-copy, notify-send); listed so they stay even if Omarchy drops them
    "libsecret",
    "gnome-keyring",
    "wl-clipboard",
    "libnotify",
]
aur = [
    "eden-bin",
    "losslesscut-bin",
    "shutter-encoder-bin",
    "oxicord-bin",
    "ookla-speedtest-bin",
    "resources-git",
    "rar",
    "speedometer",
    "qwinff",
    # alt browsers (experiments?)
    "badwolf",
    "min",
    "vieb-bin",
]

[ignore]
# Never synced: `os sync` leaves these alone on every machine and never asks about them.
# Packages: hardware-specific, part of Omarchy itself, or bootstrap tooling (uv comes from
# .os/install.sh). Web apps: the ones Omarchy installs by default.
packages = [
    "amd-ucode",
    "dotnet-runtime-9.0",
    "efibootmgr",
    "ethtool",
    "fprintd",
    "libnewt",
    "linux",
    "linux-headers",
    "neovim", # ships with Omarchy (its package list calls it "nvim")
    "omarchy",
    "omarchy-keyring",
    "omarchy-settings",
    "qt5-wayland",
    "sudo",
    "usbutils",
    "uv",
    "xmlstarlet",
]
webapps = [
    "Basecamp",
    "Discord",
    "Google Contacts",
    "Google Maps",
    "Google Messages",
    "Google Photos",
    "WhatsApp",
    "X",
    "YouTube",
]

[settings]
# Omarchy settings (`omarchy theme set`, `omarchy font set`, `omarchy default <kind>`).
theme = "Everforest"
font = "JetBrainsMono Nerd Font"
browser = "zen"
editor = "zeditor"
terminal = "kitty"

[bar]
# Bar widget options: "<widget id>.<option>" = value (`omarchy bar set <widget id> <option> <value>`).
"omarchy.clock.format" = "dddd M/d HH:mm"

[toggles]
# Omarchy's Hyprland toggles: name = "on" / "off" (`omarchy hyprland toggle <name> on|off`).
# Names: the files in /usr/share/omarchy/default/hypr/toggles/ (not flags.lua, a placeholder).
# window-no-gaps: no gaps, borders or rounded corners (SUPER + SHIFT + BACKSPACE flips it).
"window-no-gaps" = "on"

[plugins]
# Omarchy plugins: id = git URL (`omarchy plugin add <git URL>`).
"quickshell.spotify" = "https://github.com/stappmus/Omarchy-Spotify.git"
"io.github.erikburdett.diskspace" = "https://github.com/ErikBurdett/omarchy-diskspace.git"
"netmojo.omdrop" = "https://github.com/netmojo-systems/omdrop-plugin.git"
"stappmus.activity-monitor" = "https://github.com/stappmus/omarchy-activity-monitor.git"

[files]
# Files copied between $HOME/<path> and .os/files/<path>. To track another file, add a line and
# run `os sync`. Value: "always", or "lspci:<text>" for only the machines whose `lspci` output
# contains <text> (hostname is no use: every fresh Omarchy install is named "omarchy").
".config/hypr/bindings.lua" = "always"
# AMD VP9 decode workaround, only for the desktop's Raphael iGPU.
".config/chromium-flags.conf" = "lspci:Raphael"
".config/zed/settings.json" = "always"

[webapps]
# Web apps: name = URL (`omarchy webapp install <name> <url>`). Icons are not synced: each machine
