      perPage: $perPage, opponentId: $opponentId, filters: $filters) {\n      pageInfo
      { total totalPages page perPage }\n      nodes {\n        id completedAt fullRoundText
      round totalGames winnerId displayScore vodUrl state\n        event { ...EventFields
      tournament { ...TournamentFields } }\n        slots {\n          entrant { ...EntrantFields
      }\n          standing { placement stats { score { value } } }\n        }\n        games
      {\n          orderNum winnerId entrant1Score entrant2Score\n          stage
